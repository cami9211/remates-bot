name: Remates judiciales Colombia

on:
  schedule:
    # Horas en UTC. Colombia = UTC-5 (sin horario de verano).
    # Este cron corre a las 8:00, 12:00 y 16:00 hora Colombia (13:00, 17:00, 21:00 UTC).
    - cron: "0 13,17,21 * * *"
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  buscar-remates:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar bot de remates judiciales
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python find_remates_colombia.py
